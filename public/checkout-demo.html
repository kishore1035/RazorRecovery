<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Demo | RazorRecovery</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f8fafc; margin: 0; padding: 1rem; }
    .card { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); text-align: center; max-width: 420px; width: 100%; border: 1px solid #e2e8f0; }
    .badge { display: inline-block; padding: 4px 10px; background: #eff6ff; color: #2563eb; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-bottom: 1rem; }
    h2 { margin: 0 0 0.5rem 0; font-size: 1.5rem; color: #0f172a; font-weight: 700; }
    .product-info { font-size: 1.1rem; font-weight: 600; color: #334155; margin: 1rem 0; padding: 1rem; background: #f8fafc; border-radius: 8px; border: 1px solid #f1f5f9; }
    .hint { font-size: 0.85rem; color: #64748b; margin-bottom: 1.5rem; line-height: 1.4; }
    .hint strong { color: #dc2626; }
    button { background: #0f172a; color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.15s; }
    button:hover { background: #1e293b; }
    .back-link { display: inline-block; margin-top: 1.25rem; font-size: 0.875rem; color: #64748b; text-decoration: none; }
    .back-link:hover { color: #0f172a; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Storefront Checkout</span>
    <h2>Complete your purchase</h2>
    <div class="product-info" id="product-display">Loading order details...</div>
    <p class="hint">
      <strong>Demo instructions:</strong> When Razorpay modal opens, select any method and click <strong>Failure</strong> to simulate checkout abandonment and watch AI recovery!
    </p>
    <button id="pay-btn">Pay with Razorpay</button>
    <div>
      <a href="/recoveries" class="back-link">← Go to Recoveries Dashboard</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    const amount = urlParams.get('amount') || "2100000";
    const product = urlParams.get('product') || "Nike Air Max 270";
    const name = urlParams.get('name') || "Rahul Sharma";
    const email = urlParams.get('email') || "rahul@example.com";
    const phone = urlParams.get('phone') || "+919876543210";

    const formattedRupees = (parseInt(amount, 10) / 100).toLocaleString('en-IN', { style: 'currency', currency: 'INR' });
    document.getElementById('product-display').innerText = `${product} • ${formattedRupees}`;

    if (!orderId) {
      document.querySelector('.card').innerHTML = '<h2 style="color:#ef4444;">Error: Missing orderId</h2><p>Please return to <a href="/payment-links/new">Create Payment Link</a></p>';
    }

    var options = {
      "key": "rzp_test_TXS1sjTlMG1azL", 
      "amount": amount, 
      "currency": "INR",
      "name": "UrbanStep",
      "description": "Purchase: " + product,
      "order_id": orderId,
      "handler": function (response){
          alert("Payment Succeeded! ID: " + response.razorpay_payment_id + ". Check dashboard for completed outcome!");
          window.location.href = "/recoveries";
      },
      "prefill": {
          "name": name,
          "email": email,
          "contact": phone
      },
      "theme": {
          "color": "#0f172a"
      }
    };
    var rzp1 = new Razorpay(options);
    
    rzp1.on('payment.failed', async function (response){
        const err = response.error || {};
        try {
          await fetch('/api/payments/fail', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              orderId: orderId,
              paymentId: (err.metadata && err.metadata.payment_id) ? err.metadata.payment_id : ('pay_fail_' + Date.now()),
              failureCode: err.code || 'BAD_REQUEST_PAYMENT_TIMED_OUT',
              failureReason: err.description || err.reason || 'Payment failed at bank',
              customerPhone: phone,
              customerName: name
            })
          });
        } catch (e) {
          console.error("Failed to notify server of payment failure:", e);
        }
        alert("Payment Failed! Intercepted by RazorRecovery.\n📱 Motivational SMS with retry link sent to " + phone + "!");
        window.location.href = "/recoveries";
    });
    
    document.getElementById('pay-btn').onclick = function(e){
        rzp1.open();
        e.preventDefault();
    }
  </script>
</body>
</html>
